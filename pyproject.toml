[project]
name = "agent-memory-server"
version = "1.0.0"
description = "Production-oriented durable memory service for AI agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29", "redis>=5.0", "httpx>=0.27",
  "structlog>=24.2", "prometheus-client>=0.20", "opentelemetry-api>=1.26",
  "opentelemetry-sdk>=1.26", "tenacity>=8.5", "orjson>=3.10", "cryptography>=43.0"
]
[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.23", "ruff>=0.6"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
